---
# Kubernetes Monitoring & Observability Configuration for TubieTools
# Includes Application Insights integration, Prometheus, Loki, and Grafana

# PrometheusRule for custom alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tubietools-alerts
  namespace: monitoring
spec:
  groups:
  - name: tubietools.rules
    interval: 30s
    rules:
    # Pod high CPU usage alert
    - alert: PodHighCPUUsage
      expr: |
        (sum by (pod, namespace) (container_cpu_usage_seconds_total) 
         / sum by (pod, namespace) (container_spec_cpu_quota / container_spec_cpu_period)) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} has high CPU usage"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }} CPU"

    # Pod high memory usage alert
    - alert: PodHighMemoryUsage
      expr: |
        (sum by (pod, namespace) (container_memory_usage_bytes) 
         / sum by (pod, namespace) (container_spec_memory_limit_bytes)) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} has high memory usage"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage }} memory"

    # Pod restart alert
    - alert: PodRestartingTooOften
      expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} is restarting frequently"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

    # Node not ready alert
    - alert: NodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} is not ready"
        description: "Node {{ $labels.node }} has been unready for more than 5 minutes"

    # High API response time
    - alert: HighAPIResponseTime
      expr: |
        histogram_quantile(0.95, 
          sum(rate(http_request_duration_seconds_bucket{job="publicapi"}[5m])) by (le)
        ) > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "PublicAPI high response time"
        description: "95th percentile response time is {{ $value | humanizeDuration }}"

    # High error rate
    - alert: HighErrorRate
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)
        /
        sum(rate(http_requests_total[5m])) by (job) > 0.05
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "High error rate in {{ $labels.job }}"
        description: "Error rate is {{ $value | humanizePercentage }}"

    # Database connection pool exhausted
    - alert: DatabaseConnectionPoolLow
      expr: |
        sql_client_connection_pool_available / sql_client_connection_pool_total < 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Database connection pool is running low"
        description: "Only {{ $value | humanizePercentage }} of connections available"

---
# ServiceMonitor for Prometheus to scrape application metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tubietools-monitor
  namespace: tubietools
spec:
  selector:
    matchLabels:
      app: publicapi
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

