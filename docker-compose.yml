version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "P@ssw0rd123!"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "P@ssw0rd123!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TubieTools.Aspire.AppHost (Orchestrator)
  aspire-apphost:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000;https://+:5001
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TubieB2B;User Id=sa;Password=P@ssw0rd123!"
    ports:
      - "5000:5000"
      - "5001:5001"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    networks:
      - tubie-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tubie-network

volumes:
  sqlserver_data:
  redis_data:

networks:
  tubie-network:
    driver: bridge
