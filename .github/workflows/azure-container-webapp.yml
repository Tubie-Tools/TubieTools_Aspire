name: Build & Deploy Aspire Application

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME_WEB: web
  IMAGE_NAME_APPHOST: apphost
  IMAGE_NAME_API: api
  DOTNET_VERSION: '10.0.x'
  RESOURCE_GROUP: TubieTools

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore TubieTools_Aspire.sln

      - name: Build solution
        run: dotnet build TubieTools_Aspire.sln --configuration Release --no-restore

      # - name: Run tests
      #   run: dotnet test TubieTools_Aspire.sln --configuration Release --no-build --verbosity normal

  push-to-registry:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        id: azure_login_oidc
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (client secret fallback)
        if: steps.azure_login_oidc.outcome != 'success'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Fail when Azure login is not configured
        if: steps.azure_login_oidc.outcome != 'success'
        run: |
          echo "::error::Azure OIDC login failed and AZURE_CLIENT_SECRET is not configured."
          echo "Configure federated credentials for this repo/branch, or add AZURE_CLIENT_SECRET."
          exit 1

      - name: Log in to Azure Container Registry
        run: |
          TOKEN=$(az acr login --name ${{ secrets.ACR_LOGIN_SERVER }} --expose-token --output tsv --query accessToken)
          docker login ${{ secrets.ACR_LOGIN_SERVER }} --username 00000000-0000-0000-0000-000000000000 --password "$TOKEN"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_WEB }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AppHost image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.apphost
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_APPHOST }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_APPHOST }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./TubieTools_PublicAPI/api.Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_API }}:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-container-apps:
    needs: push-to-registry
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure Login (OIDC)
        id: azure_login_oidc
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (client secret fallback)
        if: steps.azure_login_oidc.outcome != 'success'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Fail when Azure login is not configured
        if: steps.azure_login_oidc.outcome != 'success'
        run: |
          echo "::error::Azure OIDC login failed and AZURE_CLIENT_SECRET is not configured."
          echo "Configure federated credentials for this repo/branch, or add AZURE_CLIENT_SECRET."
          exit 1

      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -z "${{ secrets.CONTAINER_APP_WEB_NAME }}" ] && missing="$missing CONTAINER_APP_WEB_NAME"
          [ -z "${{ secrets.CONTAINER_APP_APPHOST_NAME }}" ] && missing="$missing CONTAINER_APP_APPHOST_NAME"
          [ -z "${{ secrets.CONTAINER_APP_API_NAME }}" ] && missing="$missing CONTAINER_APP_API_NAME"
          if [ -n "$missing" ]; then
            echo "::error::The following required secrets are not configured:$missing"
            echo "Please add these secrets in the repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy Web Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_WEB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_WEB }}:${{ github.sha }}

      - name: Deploy AppHost Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_APPHOST_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_APPHOST }}:${{ github.sha }}

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_API_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME_API }}:${{ github.sha }}

  notify-deployment:
    needs: deploy-to-container-apps
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Deployment Success
        run: echo "✅ Aspire application successfully deployed to Azure Container Apps in TubieTools resource group"
