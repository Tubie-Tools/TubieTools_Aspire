trigger:
  branches:
    include:
    - main
    - develop
  paths:
    include:
    - '**'

pool:
  vmImage: 'ubuntu-latest'

variables:
  dotnetVersion: '8.0.x'
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build and Push Docker Images'
  jobs:
  - job: BuildAndPush
    displayName: 'Build Docker Images'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: $(dotnetVersion)
      displayName: 'Setup .NET'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration)'
      displayName: 'Build Solution'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        arguments: '--configuration $(buildConfiguration) --no-build'
      displayName: 'Run Unit Tests'

    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistry)'
        repository: 'publicapi'
        command: 'build'
        Dockerfile: '**/TubieTools_PublicAPI/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Build PublicAPI Docker Image'

    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistry)'
        repository: 'webfrontend'
        command: 'build'
        Dockerfile: '**/TubieTools_Aspire.Web/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Build WebFrontend Docker Image'

    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistry)'
        repository: 'sentimentapi'
        command: 'build'
        Dockerfile: '**/TubieTools_SentimentModel_WebApi/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Build SentimentAPI Docker Image'

    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistry)'
        repository: 'publicapi'
        command: 'push'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Push PublicAPI to ACR'

    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistry)'
        repository: 'webfrontend'
        command: 'push'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Push WebFrontend to ACR'

    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistry)'
        repository: 'sentimentapi'
        command: 'push'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Push SentimentAPI to ACR'

- stage: Deploy_Dev
  displayName: 'Deploy to Dev'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToDev
    displayName: 'Deploy to Dev AKS'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: KubernetesManifest@0
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: $(kubernetesServiceConnectionDev)
              namespace: 'tubietools'
              manifests: |
                $(Pipeline.Workspace)/kubernetes/deployments.yaml
              imagePullSecrets: |
                acr-credentials
              containers: |
                publicapi:$(Build.BuildId)
                webfrontend:$(Build.BuildId)
                sentimentapi:$(Build.BuildId)
            displayName: 'Deploy to Dev AKS'

- stage: Deploy_Prod
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployToProd
    displayName: 'Deploy to Prod AKS'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: KubernetesManifest@0
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: $(kubernetesServiceConnectionProd)
              namespace: 'tubietools'
              manifests: |
                $(Pipeline.Workspace)/kubernetes/deployments.yaml
              imagePullSecrets: |
                acr-credentials
              containers: |
                publicapi:$(Build.BuildId)
                webfrontend:$(Build.BuildId)
                sentimentapi:$(Build.BuildId)
            displayName: 'Deploy to Prod AKS'
